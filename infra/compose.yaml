services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: clubplatform
      POSTGRES_USER: clubplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubplatform -d clubplatform"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
